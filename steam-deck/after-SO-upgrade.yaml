---
- name: Reinstall Steam Deck Desktop packages after SteamOS upgrade
  hosts: localhost
  tasks:

    - name: Disable readonly steamos
      command: steamos-readonly disable
      become: yes
      become_method: sudo

    - name: Pacman key init
      command: pacman-key --init
      become: yes
      become_method: sudo

    - name: Pacman key populate
      command: pacman-key --populate
      become: yes
      become_method: sudo

    - name: Create link /opt/firefox/firefox /usr/bin/firefox
      file:
        src: /opt/firefox/firefox
        dest: /usr/bin/firefox
        state: link
      become: yes
      become_method: sudo

    - name: Reinstall packages with --overwrite="*"
      pacman:
        name:
          - featherpad
          - vlc
          - the_silver_searcher
          - nextcloud-client
          - wget
          - git
          - less
          - rsync
          - btop
          - audacity
          - obsidian
          - noto-fonts-emoji # tasks' icons
          - telegram-desktop
          - kcalc
          - sshpass
          - dolphin
          - spectacle
          - okular
          - gwenview
          - unzip
          - ark
          - bluedevil
          - bluez
          - bluez-libs
          - bluez-utils
          - cups
          - libcups
          - print-manager
          - nfs-utils
          - python-virtualenv
          - fish
          - ghostty
          - solaar
        state: latest
        extra_args: --overwrite="*"
      become: yes
      become_method: sudo
