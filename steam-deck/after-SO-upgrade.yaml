---
- name: Configure Steam Desk Desktop
  hosts: localhost
  tasks:

    - name: Disable readonly steamos
      command: steamos-readonly disable
      become: yes
      become_method: sudo
      tags: [base]

    - name: Pacman key init
      command: pacman-key --init
      become: yes
      become_method: sudo
      tags: [base]

    - name: Pacman key populate
      command: pacman-key --populate
      become: yes
      become_method: sudo
      tags: [base]

    - name: Create Firefox link
      file:
        src: /opt/firefox/firefox
        dest: /usr/bin/firefox
        state: link
      become: yes
      become_method: sudo
      tags: [links]

    - name: Create Obsidian link
      file:
        src: /opt/obsidian/Obsidian.AppImage
        dest: /usr/bin/obsidian
        state: link
      become: yes
      become_method: sudo
      tags: [links]

    - name: Reinstall packages with --overwrite="*"
      pacman:
        name: "{{ item }}"
        state: latest
        extra_args: --overwrite="*"
      become: yes
      become_method: sudo
      with_items:
        - base-devel
        - leafpad
        - terminator
        - vlc
        - the_silver_searcher
        - nextcloud-client
        - wget
        - git
        - rsync
        - emacs
        - btop
        - audacity
        - noto-fonts-emoji # tasks' icons
        - telegram-desktop
        - kcalc
        - sshpass
        - transmission-qt
        - solaar
      tags: [packages]
