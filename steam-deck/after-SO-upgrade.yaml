---
- name: Reinstall Steam Deck Desktop packages after SteamOS upgrade
  hosts: all
  tasks:

    - name: Disable readonly steamos
      command: steamos-readonly disable
      become: yes
      become_method: sudo

    - name: Pacman key init
      command: pacman-key --init
      become: yes
      become_method: sudo

    - name: Pacman key populate
      command: pacman-key --populate
      become: yes
      become_method: sudo

    - name: Remove obsolete packages
      pacman:
        name:
          - leafpad
          - terminator
          - emacs
          - transmission-qt
          - obsidian
          - telegram-desktop
        state: absent
      become: yes
      become_method: sudo

    - name: Remove orphan dependencies
      shell: |
        set -e
        orphans=$(pacman -Qdtq || true)
        if [ -n "$orphans" ]; then
          pacman -Rns --noconfirm $orphans
        fi
      args:
        executable: /usr/bin/bash
      become: yes
      become_method: sudo
      register: orphan_removal
      changed_when: "'no targets specified' not in orphan_removal.stdout | default('') and orphans | default('') != ''"

    - name: Find latest cached librewolf-bin package
      shell: "ls -t /home/{{ ansible_ssh_user }}/.cache/yay/librewolf-bin/librewolf-bin-*.pkg.tar.zst 2>/dev/null | head -1"
      args:
        executable: /usr/bin/bash
      register: librewolf_pkg_path
      changed_when: false
      failed_when: false
      become: yes
      become_user: "{{ ansible_ssh_user }}"

    - name: Install librewolf-bin from cache
      shell: "pacman -U --noconfirm --overwrite=\"*\" {{ librewolf_pkg_path.stdout }}"
      args:
        executable: /usr/bin/bash
      become: yes
      become_method: sudo
      when: librewolf_pkg_path.stdout != ""

    - name: Notify if librewolf-bin package is not cached
      debug:
        msg: "No cached librewolf-bin package found in ~/.cache/yay/librewolf-bin; rebuild it with yay if needed."
      when: librewolf_pkg_path.stdout == ""

    - name: Reinstall packages with --overwrite="*"
      pacman:
        name:
          - featherpad
          - vlc
          - the_silver_searcher
          - nextcloud-client
          - wget
          - git
          - less
          - rsync
          - btop
          - audacity
          - noto-fonts-emoji # tasks' icons
          - kcalc
          - sshpass
          - dolphin
          - spectacle
          - okular
          - gwenview
          - unzip
          - ark
          - cups
          - libcups
          - print-manager
          - nfs-utils
          - python-virtualenv
          - fish
          - ghostty
          - solaar
        state: latest
        extra_args: --overwrite="*"
      become: yes
      become_method: sudo
